<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Maintenance — Perfect Jewelry Partners</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="maintenance-body">
  <header class="maintenance-header">
    <div class="logo-zone">
      <div class="logo-mark" aria-label="Perfect Jewelry Partners logo">PJ</div>
      <div>
        <div class="logo-sub">Partner sales &amp; accounting</div>
      </div>
    </div>
    <div class="header-right">
      <span class="company-badge"><span class="company-badge-dot" id="badgeDot"></span> <span id="modeLabel">Checking status…</span></span>
    </div>
  </header>

  <main class="maintenance-main">
    <div class="maint-card">
      <div class="maint-icon" id="maintIcon" aria-hidden="true"><span class="maint-spinner"></span></div>

      <div class="section-heading" id="eyebrow">Checking status</div>
      <h1 id="heading">One moment.</h1>
      <p class="page-sub maint-body" id="bodyText">Checking what's going on…</p>

      <div class="maint-checklist">
        <div class="maint-check" id="pillConnect"><span class="maint-dot"></span><span>Reaching the server</span></div>
        <div class="maint-check" id="pillDb"><span class="maint-dot"></span><span>Database connection</span></div>
        <div class="maint-check" id="pillReady"><span class="maint-dot"></span><span>Ready to sign in</span></div>
      </div>

      <div class="maintenance-actions">
        <button class="btn btn-primary btn-sm" type="button" id="btnRecheck">Check now</button>
        <a class="btn btn-ghost btn-sm" type="button" id="btnContact"
           href="mailto:jeffmathewg@gmail.com?subject=Perfect%20Jewelry%20Partners%20is%20down">Contact Shin</a>
      </div>

      <!-- Same kpi-card the dashboard itself uses — one honest status grid,
           driven entirely by what /api/health actually reports. No fixed
           "15–30 mins" or fake "backups verified" copy. -->
      <div class="kpi-grid maint-kpis">
        <div class="kpi-card">
          <div class="kpi-label">Reason</div>
          <div class="kpi-value maint-kpi-value" id="reasonValue">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label" id="durationLabel">Down for</div>
          <div class="kpi-value maint-kpi-value" id="durationValue">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Next check</div>
          <div class="kpi-value maint-kpi-value" id="nextCheckValue">—</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    /*
     * Two DIFFERENT situations show this page, and they need DIFFERENT
     * handling:
     *
     *   1. Someone deliberately turned on MAINTENANCE_MODE. Only turning it
     *      back off (in Render's environment, then a restart) fixes this —
     *      a healthy database doesn't mean the maintenance window is over.
     *
     *   2. The database is unreachable and the server is auto-retrying.
     *      This one really does self-heal — the moment /api/health reports
     *      ok:true, the outage is over and it's safe to go back.
     *
     * /api/health reports `maintenanceMode` unconditionally so this page can
     * tell the two apart and behave correctly for each.
     */
    const $ = (id) => document.getElementById(id);
    let checking = false;
    let nextCheckAt = 0;

    function setCheck(el, state) {
      // state: "pending" | "ok" | "bad"
      el.classList.remove("ok", "bad", "pending");
      el.classList.add(state);
    }
    function setBadge(state) {
      $("badgeDot").classList.remove("ok", "bad");
      if (state === "ok" || state === "bad") $("badgeDot").classList.add(state);
    }
    function setIconState(state) {
      // "checking" keeps the spinner turning; "ok"/"bad" swap it for a still glyph
      $("maintIcon").classList.remove("ok", "bad", "checking");
      $("maintIcon").classList.add(state);
    }

    function fmtDuration(ms) {
      if (ms < 0) ms = 0;
      const s = Math.floor(ms / 1000);
      if (s < 60) return s + "s";
      const m = Math.floor(s / 60), rs = s % 60;
      if (m < 60) return m + "m " + rs + "s";
      const h = Math.floor(m / 60), rm = m % 60;
      return h + "h " + rm + "m";
    }

    function tick() {
      const downSinceMs = window.__downSince;
      if (downSinceMs) $("durationValue").textContent = fmtDuration(Date.now() - downSinceMs);
      const remain = Math.max(0, Math.round((nextCheckAt - Date.now()) / 1000));
      $("nextCheckValue").textContent = checking ? "checking…" : remain + "s";
    }

    function renderMaintenanceMode() {
      setIconState("checking");
      setBadge("bad");
      $("modeLabel").textContent = "Scheduled maintenance";
      setCheck($("pillConnect"), "ok");
      setCheck($("pillDb"), "ok");
      setCheck($("pillReady"), "bad");
      $("eyebrow").textContent = "Scheduled maintenance";
      $("heading").textContent = "We're making some changes.";
      $("bodyText").textContent = "The dashboard is intentionally offline for maintenance. This page will move on automatically once it's switched back on.";
      $("reasonValue").textContent = "Planned maintenance";
      $("durationLabel").textContent = "In progress for";
    }

    function renderDbDown(body) {
      setIconState("checking");
      setBadge("bad");
      $("modeLabel").textContent = "Reconnecting";
      setCheck($("pillConnect"), "ok");
      setCheck($("pillDb"), "bad");
      setCheck($("pillReady"), "bad");
      $("eyebrow").textContent = "Reconnecting";
      $("heading").textContent = "We're tuning the system for a smoother run.";
      $("bodyText").textContent = "Still reconnecting to the database. This page checks automatically and will take you straight to the dashboard the moment it's ready.";
      $("reasonValue").textContent = "Database unreachable";
      $("durationLabel").textContent = "Down for";
      if (body && body.downSince) window.__downSince = new Date(body.downSince).getTime();
    }

    function renderBackOnline() {
      setIconState("ok");
      setBadge("ok");
      setCheck($("pillConnect"), "ok");
      setCheck($("pillDb"), "ok");
      setCheck($("pillReady"), "ok");
      $("modeLabel").textContent = "Back online";
      $("eyebrow").textContent = "All systems go";
      $("heading").textContent = "We're back. Taking you in…";
      $("bodyText").textContent = "The dashboard is ready. Redirecting automatically.";
      $("reasonValue").textContent = "Resolved";
      setTimeout(() => { window.location.href = "/"; }, 900);
    }

    function renderUnreachable() {
      setIconState("bad");
      setBadge("bad");
      setCheck($("pillConnect"), "bad");
      setCheck($("pillDb"), "bad");
      setCheck($("pillReady"), "bad");
      $("modeLabel").textContent = "Unreachable";
      $("eyebrow").textContent = "Reconnecting";
      $("heading").textContent = "Having trouble reaching the server.";
      $("bodyText").textContent = "Retrying automatically.";
      $("reasonValue").textContent = "No response from server";
    }

    async function check() {
      if (checking) return;
      checking = true;
      $("btnRecheck").disabled = true;
      setCheck($("pillConnect"), "pending");
      setIconState("checking");
      tick();

      try {
        const res = await fetch("/api/health", { cache: "no-store" });
        let body = null;
        try { body = await res.json(); } catch (_) { /* handled below */ }

        if (body && body.maintenanceMode) renderMaintenanceMode();
        else if (res.ok && body && body.ok) renderBackOnline();
        else if (body) renderDbDown(body);
        else renderUnreachable();
      } catch (e) {
        renderUnreachable();
      } finally {
        checking = false;
        $("btnRecheck").disabled = false;
        nextCheckAt = Date.now() + 10000;
        tick();
      }
    }

    $("btnRecheck").addEventListener("click", check);
    check();
    setInterval(check, 10000);
    setInterval(tick, 1000);
  </script>
</body>
</html>
