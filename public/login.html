<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Perfect Jewelry Partners</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
  <div style="width:min(380px,92vw);">
    <div class="kpi-card" style="padding:26px;">
      <div class="page-title" style="margin-bottom:4px;">Sign in</div>
      <div class="page-sub" style="margin-bottom:18px;">Enter your account details.</div>
      <form id="loginForm">
        <label class="kpi-label">Email</label>
        <input class="keyin" type="email" id="email" autocomplete="username" required style="margin-bottom:12px;">
        <label class="kpi-label">Password</label>
        <span class="pw-field">
          <input class="keyin" type="password" id="password" autocomplete="current-password" required>
          <button type="button" class="pw-eye" aria-label="Show password">
            <svg class="i-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="i-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C5 20 1 12 1 12a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </span>
        <div id="msg" class="page-sub" style="color:var(--danger); margin:10px 0 0; min-height:16px;"></div>
        <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center; margin-top:16px;">Sign in</button>
      </form>
    </div>
    </div>
  <script>
    const $ = (s) => document.querySelector(s);
    document.querySelectorAll(".pw-eye").forEach((btn) => {
      btn.addEventListener("click", () => {
        const inp = btn.parentElement.querySelector("input");
        const reveal = inp.type === "password";
        inp.type = reveal ? "text" : "password";
        btn.classList.toggle("on", reveal);
        btn.setAttribute("aria-label", reveal ? "Hide password" : "Show password");
      });
    });
    $("#loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("#msg").textContent = "";
      const r = await fetch("/api/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: $("#email").value.trim(), password: $("#password").value }),
      });
      const d = await r.json();
      if (d.ok) window.location = "/";
      else $("#msg").textContent = d.error || "Sign in failed.";
    });
  </script>
</body>
</html>
